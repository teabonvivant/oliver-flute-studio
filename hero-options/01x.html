<body><h1>01 象牙紙・晨影：六個變化</h1><p class="sub">每款只試一個改法，方便看出「差的那一點」是甚麼。每款都是完整首頁，點入去可捲動、按住聽音，底部按鈕可前後切換。</p><div class="grid"><a class="card" href="u0.html"><img src="shots/u0-d.jpg" alt="" loading="lazy"><span class="n">0</span><b>原版 01</b><p>對照：現時的質感版 01。</p></a>
<a class="card" href="ua.html"><img src="shots/ua-d.jpg" alt="" loading="lazy"><span class="n">a</span><b>譜紙</b><p>加手寫簡譜紙和鉛筆：樂器像剛下課放在枱上，多了人的痕跡。</p></a>
<a class="card" href="ub.html"><img src="shots/ub-d.jpg" alt="" loading="lazy"><span class="n">b</span><b>斜陽</b><p>改成下午斜陽，窗影直接橫過鼓面和長笛，明暗對比更強。</p></a>
<a class="card" href="uc.html"><img src="shots/uc-d.jpg" alt="" loading="lazy"><span class="n">c</span><b>近鏡交疊</b><p>鏡頭拉近，鼓出畫邊，南簫壓在長笛尾節上，不再三件平排。</p></a>
<a class="card" href="ud.html"><img src="shots/ud-d.jpg" alt="" loading="lazy"><span class="n">d</span><b>低角度景深</b><p>鏡頭放低成斜角，長笛吹口清楚在前，鼓在後面虛化。</p></a>
<a class="card" href="ue.html"><img src="shots/ue-d.jpg" alt="" loading="lazy"><span class="n">e</span><b>麻布</b><p>鼓下加一塊摺起的亞麻布，紙、布、金屬、竹四種質地對比。</p></a>
<a class="card" href="uf.html"><img src="shots/uf-d.jpg" alt="" loading="lazy"><span class="n">f</span><b>綜合</b><p>斜陽＋麻布＋簡譜紙＋南簫輕壓長笛。</p></a></div></body></html>
