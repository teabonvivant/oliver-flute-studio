<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>網站後台｜張老師音樂學院</title>
<style>
:root{--ink:#22302f;--accent:#b04f3c;--accent-h:#963f2f;--muted:#5d6a69;--paper:#f3f6f6;--white:#fbfdfd;--line:#d5e0df;--tint:#e6efee;--ok:#2f6f4f;--warn:#9a6a12;--bad:#a8342a;--r:14px;font-family:"PingFang HK","Noto Sans HK","Microsoft JhengHei",system-ui,sans-serif}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:var(--paper);color:var(--ink);font-size:16px;line-height:1.55}
button,select,textarea,input{font:inherit;color:inherit}button{cursor:pointer}
.btn{border:1px solid var(--line);background:var(--white);padding:.55rem .95rem;border-radius:999px;min-height:44px}
.btn:hover{border-color:#b9cac9}.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}.btn.pri:hover{background:var(--accent-h)}
.btn.bad{color:var(--bad)}.btn:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:3px solid #2b7a78;outline-offset:2px}
.login[hidden]{display:none}.login{min-height:100%;display:grid;place-items:center;padding:24px}
.login form{width:100%;max-width:380px;background:var(--white);border:1px solid var(--line);border-radius:22px;padding:32px 28px;box-shadow:0 18px 50px #22302f1a}
.login h1{font-size:1.35rem;margin:0 0 .25rem}.login p{margin:0 0 1.4rem;color:var(--muted);font-size:.95rem}
.login input{width:100%;min-height:48px;border:1px solid var(--line);border-radius:12px;padding:0 14px;background:#fff;margin-bottom:12px}
.err{color:var(--bad);min-height:1.4em;font-size:.92rem;margin:0 0 .6rem}
.app{display:none;height:100%;grid-template-columns:280px 1fr;grid-template-rows:auto 1fr}
.app.on{display:grid}
header.top{grid-column:1/3;display:flex;gap:10px;align-items:center;padding:10px 16px;background:var(--white);border-bottom:1px solid var(--line);flex-wrap:wrap}
header.top h1{font-size:1.02rem;margin:0 auto 0 0;white-space:nowrap}
.chip{font-size:.82rem;color:var(--muted);background:var(--tint);padding:4px 10px;border-radius:999px}
.chip.ok{color:var(--ok)}.chip.off{color:var(--bad)}
aside{border-right:1px solid var(--line);background:var(--white);display:flex;flex-direction:column;min-height:0}
aside .head{padding:12px}aside .head .btn{width:100%}
#tlist{overflow:auto;flex:1;padding:0 8px 12px}
.t{display:block;width:100%;text-align:left;border:0;background:none;padding:10px 12px;border-radius:10px;margin-bottom:2px}
.t:hover{background:var(--tint)}.t.on{background:var(--tint);font-weight:600}.t small{display:block;color:var(--muted);font-weight:400}
main{display:flex;flex-direction:column;min-height:0;min-width:0}
.bar{display:flex;gap:8px;align-items:center;padding:8px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap;background:var(--paper)}
.bar .title{font-weight:600;margin-right:auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#msgs{flex:1;overflow:auto;padding:18px 16px 8px}
.empty{color:var(--muted);max-width:520px;margin:8vh auto;text-align:center}.empty b{display:block;font-size:1.1rem;color:var(--ink);margin-bottom:.4rem}
.m{max-width:760px;margin:0 auto 14px}
.m .who{font-size:.8rem;color:var(--muted);margin-bottom:3px}
.m .bub{background:var(--white);border:1px solid var(--line);border-radius:var(--r);padding:11px 14px;overflow-wrap:anywhere}
.m.user .bub{background:#fff4ef;border-color:#efd3c9}
.m .bub p{margin:.35em 0}.m .bub p:first-child{margin-top:0}.m .bub p:last-child{margin-bottom:0}
.m .bub code{background:var(--tint);padding:1px 5px;border-radius:5px;font-size:.9em}
.m .bub pre{background:#22302f;color:#e9f1f0;padding:10px 12px;border-radius:10px;overflow:auto;font-size:.88rem}
.m .bub a{color:var(--accent)}
.files{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.files a,.files span{font-size:.85rem;background:var(--tint);border-radius:8px;padding:4px 9px;text-decoration:none;color:var(--ink)}
.files a:hover{background:#d8e6e5}
.st{font-size:.82rem;color:var(--warn);margin-top:6px}.st.bad{color:var(--bad)}
.dots::after{content:"";display:inline-block;width:1.2em;animation:d 1.2s steps(4,end) infinite;overflow:hidden;vertical-align:bottom}
@keyframes d{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
@media (prefers-reduced-motion:reduce){.dots::after{animation:none;content:"…"}}
form.comp{border-top:1px solid var(--line);background:var(--white);padding:10px 16px calc(10px + env(safe-area-inset-bottom));position:relative}
.comp .row{max-width:760px;margin:0 auto;display:flex;gap:8px;align-items:flex-end}
.comp textarea{flex:1;min-height:48px;max-height:180px;border:1px solid var(--line);border-radius:14px;padding:11px 14px;resize:none;background:#fff}
.comp .opts{max-width:760px;margin:0 auto 8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.comp select{min-height:40px;border:1px solid var(--line);border-radius:999px;padding:0 12px;background:#fff;max-width:100%}
.pending{display:flex;flex-wrap:wrap;gap:6px}
.pending span{font-size:.85rem;background:var(--tint);border-radius:8px;padding:3px 4px 3px 9px}
.pending button{border:0;background:none;padding:0 6px;color:var(--muted);min-height:24px}
.drop{position:fixed;inset:0;background:#2b7a78d9;color:#fff;display:none;place-items:center;font-size:1.4rem;z-index:50;pointer-events:none}
.drop.on{display:grid}
.menu{display:none}
dialog{border:1px solid var(--line);border-radius:18px;padding:22px;max-width:min(92vw,440px);box-shadow:0 20px 60px #22302f33}
dialog::backdrop{background:#22302f66}dialog h2{margin:0 0 .5rem;font-size:1.1rem}dialog p{margin:.3rem 0 1rem;color:var(--muted)}
dialog .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
dialog input{width:100%;min-height:44px;border:1px solid var(--line);border-radius:10px;padding:0 12px;margin-bottom:8px}
@media(max-width:820px){
 .app{grid-template-columns:1fr}header.top{grid-column:1}
 aside{position:fixed;inset:0 20% 0 0;z-index:30;transform:translateX(-102%);transition:transform .2s;box-shadow:8px 0 30px #22302f33;max-width:320px}
 aside.open{transform:none}.menu{display:inline-block}
 .app{grid-template-rows:auto 1fr}
 header.top{padding:8px 10px;gap:6px}header.top h1{font-size:.95rem}.btn{min-height:40px;padding:.35rem .8rem}#prev,#live{display:none}
 .comp .opts{margin-bottom:6px}.comp{padding-top:8px}
}
@media (prefers-reduced-motion:reduce){aside{transition:none}}
</style>
</head>
<body>
<section class="login" id="login" hidden>
 <form id="lf" autocomplete="on">
  <h1>網站後台</h1><p>張老師音樂學院 · oliverflute.com</p>
  <label for="pw" class="sr" style="position:absolute;left:-9999px">密碼</label>
  <input id="pw" type="password" placeholder="密碼" autocomplete="current-password" required>
  <p class="err" id="lerr" role="alert"></p>
  <button class="btn pri" style="width:100%" id="lbtn">登入</button>
 </form>
</section>

<div class="app" id="app">
 <header class="top">
  <button class="btn menu" id="menu" aria-label="對話列表">☰</button>
  <h1>網站後台 · AI 管理員</h1>
  <span class="chip" id="wchip">連線中…</span>
  <button class="btn" id="prev">預覽網站</button>
  <button class="btn" id="live">正式站</button>
  <button class="btn" id="more">更多</button>
 </header>
 <aside id="side">
  <div class="head"><button class="btn pri" id="newt">＋ 新對話</button></div>
  <div id="tlist"></div>
 </aside>
 <main>
  <div class="bar"><span class="title" id="ttitle">AI 管理員</span>
   <button class="btn" id="ren" hidden>改名</button><button class="btn bad" id="del" hidden>刪除</button></div>
  <div id="msgs"></div>
  <form class="comp" id="cf">
   <div class="opts">
    <label class="chip" for="model">AI 模型</label><select id="model" aria-label="AI 模型"></select>
    <button type="button" class="btn" id="attach">＋ 檔案</button><input type="file" id="fi" multiple hidden>
    <span class="pending" id="pend"></span>
   </div>
   <div class="row"><textarea id="txt" rows="1" placeholder="告訴 AI 要改甚麼，或拖放檔案進來"></textarea>
    <button class="btn pri" id="send">傳送</button><button type="button" class="btn bad" id="stop" hidden>停止</button></div>
  </form>
 </main>
</div>
<div class="drop" id="drop">放開以加入檔案</div>

<dialog id="dmore"><h2>網站與帳戶</h2>
 <p id="siteinfo"></p>
 <div class="acts" style="justify-content:flex-start;margin-bottom:10px">
  <button class="btn" data-job="preview">重新建置預覽</button>
  <button class="btn pri" data-job="publish">發佈到正式站</button>
  <button class="btn bad" data-job="rollback">回退到上一版</button></div>
 <div class="acts" style="justify-content:flex-start;margin-bottom:6px"><button class="btn" id="prev2">開啟預覽網站</button><button class="btn" id="live2">開啟正式站</button></div>
 <p id="jobinfo"></p>
 <div class="acts"><button class="btn" id="pwbtn">更改密碼</button><button class="btn" id="lo">登出</button><button class="btn" value="x" id="closem">關閉</button></div>
</dialog>
<dialog id="dpw"><h2>更改密碼</h2><input id="op" type="password" placeholder="目前密碼" autocomplete="current-password"><input id="np" type="password" placeholder="新密碼（至少 12 個字元）" autocomplete="new-password">
 <p class="err" id="perr"></p><div class="acts"><button class="btn" id="pc">取消</button><button class="btn pri" id="ps">儲存</button></div></dialog>
<dialog id="dconf"><h2 id="ch"></h2><p id="cp"></p><div class="acts"><button class="btn" id="cn">取消</button><button class="btn pri" id="cy">確定</button></div></dialog>

<script>
const $=s=>document.querySelector(s);
const api=async(body,form)=>{
  const o=form?{method:"POST",body:form,headers:{"x-requested-with":"ofs"}}:{method:"POST",body:JSON.stringify(body),headers:{"content-type":"application/json","x-requested-with":"ofs"}};
  let r;try{r=await fetch("/api/admin",o)}catch{throw Error("網絡中斷")}
  const d=await r.json().catch(()=>({error:"伺服器回應不正確"}));
  if(r.status===401&&d.error==="請先登入"){showLogin();throw Error("請先登入")}
  if(!r.ok)throw Error(d.error||"操作失敗");return d};
let S={tid:null,models:[],files:[],busy:false,poll:null,me:null,lastKey:""};
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function md(t){
  const blocks=[];t=esc(t||"").replace(/```(?:\w+)?\n([\s\S]*?)```/g,(_,c)=>{blocks.push(c);return"\u0000"+(blocks.length-1)+"\u0000"});
  const inl=s=>s.replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>").replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>').replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g,'$1<a href="$2" target="_blank" rel="noopener noreferrer">$2</a>');
  return t.split(/\n{2,}/).map(p=>/^\u0000\d+\u0000$/.test(p.trim())?p:"<p>"+inl(p).replace(/\n/g,"<br>")+"</p>").join("").replace(/\u0000(\d+)\u0000/g,(_,i)=>"<pre>"+blocks[i]+"</pre>")}
function fmtSize(n){return n>1e6?(n/1e6).toFixed(1)+" MB":Math.max(1,Math.round(n/1e3))+" KB"}
function ago(ms){const s=(Date.now()-ms)/1000;return s<60?"剛才":s<3600?Math.round(s/60)+" 分鐘前":s<86400?Math.round(s/3600)+" 小時前":new Date(ms).toLocaleDateString("zh-HK")}
function showLogin(){$("#app").classList.remove("on");$("#login").hidden=false;stopPoll();setTimeout(()=>$("#pw").focus(),50)}
function stopPoll(){clearTimeout(S.poll);S.poll=null}

$("#lf").onsubmit=async e=>{e.preventDefault();$("#lerr").textContent="";$("#lbtn").disabled=true;
  try{await api({a:"login",password:$("#pw").value});$("#pw").value="";await boot()}catch(x){$("#lerr").textContent=x.message}finally{$("#lbtn").disabled=false}};

async function boot(){
  const me=await api({a:"me"});S.me=me;S.models=me.models;
  $("#login").hidden=true;$("#app").classList.add("on");
  const sel=$("#model");const groups={};me.models.forEach(m=>(groups[m.group]=groups[m.group]||[]).push(m));
  sel.innerHTML=Object.entries(groups).map(([g,l])=>`<optgroup label="${g}">${l.map(m=>`<option value="${m.id}">${esc(m.name)}</option>`).join("")}</optgroup>`).join("");
  renderStatus();await loadThreads();tick()}
function renderStatus(){
  const me=S.me,on=Date.now()-me.worker<20000;
  $("#wchip").textContent=on?"AI 管理員在線":"AI 管理員離線（訊息會排隊）";$("#wchip").className="chip "+(on?"ok":"off");
  const p=me.site.prod,pv=me.site.preview;
  $("#siteinfo").innerHTML=(p?`正式站版本 <code>${esc(p.id.slice(0,8))}</code>，${ago(Date.parse(p.created))}發佈。`:"尚未讀到正式站版本。")+(me.site.prev?`<br>上一版 <code>${esc(me.site.prev.id.slice(0,8))}</code>（回退用）。`:"")+(pv&&pv.time?`<br>預覽最後更新：${esc(pv.time.slice(0,16).replace("T"," "))}（香港時間）。`:"");
  const j=me.jobs[0];$("#jobinfo").innerHTML=j?`最近操作：${{preview:"更新預覽",publish:"發佈正式站",rollback:"回退"}[j.type]} — ${j.status==="done"?"✓ "+esc(j.result):j.status==="error"?"✗ "+esc(j.result):"進行中…"}`:"";
  document.querySelectorAll("[data-job]").forEach(b=>b.disabled=me.jobs.some(x=>x.status==="pending"||x.status==="running"))}
async function loadThreads(){
  const {threads}=await api({a:"threads"});
  $("#tlist").innerHTML=threads.map(t=>`<button class="t ${t.id===S.tid?"on":""}" data-id="${t.id}">${esc(t.title)}<small>${t.busy?"處理中…":ago(t.updated)}</small></button>`).join("")||'<p style="padding:12px;color:var(--muted)">還沒有對話</p>';
  if(!S.tid&&threads[0])await openThread(threads[0].id);else if(!threads.length)renderMsgs([],null)}
$("#tlist").onclick=e=>{const b=e.target.closest(".t");if(b){openThread(b.dataset.id);$("#side").classList.remove("open")}};
async function openThread(id){S.tid=id;S.lastKey="";await refreshThread();loadThreads().catch(()=>{})}
async function refreshThread(){
  if(!S.tid)return;const d=await api({a:"thread",id:S.tid});
  $("#ttitle").textContent=d.thread.title;$("#ren").hidden=$("#del").hidden=false;
  if(S.models.some(m=>m.id===d.thread.model)&&!document.activeElement.matches("#model"))$("#model").value=d.thread.model;
  renderMsgs(d.msgs,d.thread)}
function renderMsgs(msgs,th){
  const busy=msgs.some(m=>m.role==="user"&&(m.status==="pending"||m.status==="working"||m.status==="cancel"));S.busy=busy;
  $("#send").hidden=false;$("#stop").hidden=!busy;
  const key=JSON.stringify(msgs.map(m=>[m.id,m.text.length,m.status,m.err,m.files.length]));
  if(key===S.lastKey)return;S.lastKey=key;const box=$("#msgs"),near=box.scrollHeight-box.scrollTop-box.clientHeight<120;
  if(!msgs.length){box.innerHTML='<div class="empty"><b>告訴 AI 管理員要怎樣更新網站</b>可以直接打字，也可以拖放相片、文字檔、文件進來。它會改好並先放到「預覽」給你看，你確認後再按「發佈到正式站」。</div>';return}
  box.innerHTML=msgs.map(m=>{
    const files=m.files.length?`<div class="files">${m.files.map(f=>m.role==="ai"?`<a href="/api/admin?a=dl&m=${encodeURIComponent(m.id)}&i=${f.i}" download>⬇ ${esc(f.name)} · ${fmtSize(f.size)}</a>`:`<span>📎 ${esc(f.name)} · ${fmtSize(f.size)}</span>`).join("")}</div>`:"";
    const st=m.role==="user"?(m.status==="pending"?'<div class="st">排隊中，等待 AI 管理員接手</div>':m.status==="working"?'<div class="st">AI 管理員處理中</div>':m.status==="error"?`<div class="st bad">${esc(m.err)}</div>`:""):
      (m.status==="working"?'<div class="st"><span class="dots">處理中</span></div>':m.err?`<div class="st ${m.status==="error"?"bad":""}">${esc(m.err)}</div>`:"");
    const model=S.models.find(x=>x.id===m.model);
    return `<div class="m ${m.role}"><div class="who">${m.role==="user"?"你":"AI 管理員"+(model?" · "+esc(model.name):"")}</div><div class="bub">${m.text?md(m.text):(m.role==="ai"?"":"（只有附件）")}${files}${st}</div></div>`}).join("");
  if(near||msgs.length)box.scrollTop=box.scrollHeight}
function tick(){stopPoll();S.poll=setTimeout(async()=>{
  try{ if(!document.hidden||S.busy){await refreshThread();}
    S.me=await api({a:"me"});renderStatus();if(!S.busy)loadThreads().catch(()=>{});}catch(e){}
  tick()},S.busy?1500:5000)}

$("#newt").onclick=async()=>{const d=await api({a:"newthread",model:$("#model").value});S.tid=d.thread.id;S.lastKey="";await refreshThread();await loadThreads();$("#side").classList.remove("open");$("#txt").focus()};
$("#model").onchange=()=>S.tid&&api({a:"setthread",id:S.tid,model:$("#model").value}).catch(()=>{});
const dlg=(t,p,ok)=>new Promise(res=>{$("#ch").textContent=t;$("#cp").textContent=p;const d=$("#dconf");$("#cy").textContent=ok||"確定";d.showModal();$("#cn").onclick=()=>{d.close();res(false)};$("#cy").onclick=()=>{d.close();res(true)}});
$("#ren").onclick=async()=>{const n=prompt("對話名稱",$("#ttitle").textContent);if(n&&n.trim()){await api({a:"setthread",id:S.tid,title:n.trim()});await refreshThread();loadThreads()}};
$("#del").onclick=async()=>{if(!await dlg("刪除這個對話？","對話內容和上載的檔案會一併刪除，無法還原。","刪除"))return;try{await api({a:"delthread",id:S.tid})}catch(e){alert(e.message);return}S.tid=null;$("#ren").hidden=$("#del").hidden=true;$("#ttitle").textContent="AI 管理員";await loadThreads()};
$("#menu").onclick=()=>$("#side").classList.toggle("open");

function setFiles(l){for(const f of l){if(S.files.length>=8){alert("一次最多 8 個檔案");break}S.files.push(f)}drawPend()}
function drawPend(){$("#pend").innerHTML=S.files.map((f,i)=>`<span>${esc(f.name)} · ${fmtSize(f.size)}<button type="button" data-i="${i}" aria-label="移除 ${esc(f.name)}">✕</button></span>`).join("")}
$("#pend").onclick=e=>{const b=e.target.closest("button");if(b){S.files.splice(+b.dataset.i,1);drawPend()}};
$("#attach").onclick=()=>$("#fi").click();$("#fi").onchange=e=>{setFiles([...e.target.files]);e.target.value=""};
let dc=0;addEventListener("dragenter",e=>{if(e.dataTransfer&&[...e.dataTransfer.types].includes("Files")){dc++;$("#drop").classList.add("on")}});
addEventListener("dragleave",()=>{dc=Math.max(0,dc-1);if(!dc)$("#drop").classList.remove("on")});
addEventListener("dragover",e=>e.preventDefault());
addEventListener("drop",e=>{e.preventDefault();dc=0;$("#drop").classList.remove("on");if(e.dataTransfer.files.length)setFiles([...e.dataTransfer.files])});
$("#txt").addEventListener("paste",e=>{const f=[...(e.clipboardData?.files||[])];if(f.length){e.preventDefault();setFiles(f)}});
$("#txt").addEventListener("input",e=>{e.target.style.height="auto";e.target.style.height=Math.min(180,e.target.scrollHeight)+"px"});
$("#txt").addEventListener("keydown",e=>{if(e.key==="Enter"&&(e.metaKey||e.ctrlKey)){e.preventDefault();$("#cf").requestSubmit()}});
$("#cf").onsubmit=async e=>{e.preventDefault();
  const text=$("#txt").value.trim();if(!text&&!S.files.length)return;
  if(!S.tid){const d=await api({a:"newthread",model:$("#model").value});S.tid=d.thread.id}
  const fd=new FormData();fd.set("a","send");fd.set("tid",S.tid);fd.set("text",text);fd.set("model",$("#model").value);S.files.forEach(f=>fd.append("files",f,f.name));
  $("#send").disabled=true;
  try{await api(null,fd);$("#txt").value="";$("#txt").style.height="auto";S.files=[];drawPend();S.lastKey="";await refreshThread();loadThreads();tick()}
  catch(x){alert(x.message)}finally{$("#send").disabled=false}};
$("#stop").onclick=async()=>{const d=await api({a:"thread",id:S.tid});const m=[...d.msgs].reverse().find(x=>x.role==="user"&&["pending","working"].includes(x.status));if(m){await api({a:"stop",id:m.id});refreshThread()}};

$("#prev").onclick=()=>window.open(S.me?.site?.preview?.url||"https://admin-preview.oliverflute-studio.pages.dev","_blank","noopener");
$("#live").onclick=()=>window.open("https://www.oliverflute.com/","_blank","noopener");
$("#prev2").onclick=()=>$("#prev").onclick();$("#live2").onclick=()=>$("#live").onclick();
$("#more").onclick=async()=>{S.me=await api({a:"me"});renderStatus();$("#dmore").showModal()};
$("#closem").onclick=e=>{e.preventDefault();$("#dmore").close()};
document.querySelectorAll("[data-job]").forEach(b=>b.onclick=async()=>{
  const t=b.dataset.job,ask={preview:["重新建置預覽？","會用目前的網站源碼重新建置，更新預覽網址，正式站不受影響。","更新預覽"],publish:["發佈到正式站？","現時預覽的內容會公開到 www.oliverflute.com，所有訪客即時看到。請先確認預覽網址已檢查過。","發佈"],rollback:["回退到上一版？","正式站會立即還原到上一個版本（"+(S.me.site.prev?S.me.site.prev.id.slice(0,8):"—")+"），之後的改動不會公開，直至再次發佈。","回退"]}[t];
  $("#dmore").close();if(!await dlg(...ask))return;
  try{await api({a:"job",type:t});S.me=await api({a:"me"});$("#dmore").showModal();renderStatus()}catch(e){alert(e.message)}});
$("#pwbtn").onclick=()=>{$("#dmore").close();$("#perr").textContent="";$("#dpw").showModal()};
$("#pc").onclick=()=>$("#dpw").close();
$("#ps").onclick=async()=>{try{await api({a:"chpass",old:$("#op").value,new:$("#np").value});$("#op").value=$("#np").value="";$("#dpw").close();alert("密碼已更改，其他裝置需重新登入")}catch(e){$("#perr").textContent=e.message}};
$("#lo").onclick=async()=>{await api({a:"logout"}).catch(()=>{});location.reload()};
api({a:"me"}).then(()=>boot()).catch(()=>showLogin());
</script>
</body>
</html>
