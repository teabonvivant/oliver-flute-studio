<svg xmlns="http://www.w3.org/2000/svg" width="800" height="920" viewBox="0 0 800 920" role="img" aria-labelledby="t d"><title id="t">簡譜與竹笛的連接</title><desc id="d">看調性：確認 1 對應的音高；確認指法：配合樂器與筒音安排；唱後再吹：把聲音與動作連起來</desc><rect width="800" height="920" fill="#eff2ed"/><text x="42" y="70" font-family="Microsoft JhengHei, sans-serif" font-size="34" fill="#1d2824" font-weight="600">簡譜與竹笛的連接</text><path d="M72 188V774" stroke="#9aaea0" stroke-width="2"/><circle cx="72" cy="200" r="23" fill="#254f45"/><text x="72" y="210" text-anchor="middle" font-size="27" font-family="sans-serif" fill="#fff">1</text><text x="126" y="210" font-family="Microsoft JhengHei, sans-serif" font-size="32" font-weight="600" fill="#1d2824">看調性</text><text x="126" y="262" font-family="Microsoft JhengHei, sans-serif" font-size="34" fill="#3c5147">確認 1 對應的音高</text><circle cx="72" cy="426" r="23" fill="#254f45"/><text x="72" y="436" text-anchor="middle" font-size="27" font-family="sans-serif" fill="#fff">2</text><text x="126" y="436" font-family="Microsoft JhengHei, sans-serif" font-size="32" font-weight="600" fill="#1d2824">確認指法</text><text x="126" y="488" font-family="Microsoft JhengHei, sans-serif" font-size="34" fill="#3c5147">配合樂器與筒音安排</text><circle cx="72" cy="652" r="23" fill="#254f45"/><text x="72" y="662" text-anchor="middle" font-size="27" font-family="sans-serif" fill="#fff">3</text><text x="126" y="662" font-family="Microsoft JhengHei, sans-serif" font-size="32" font-weight="600" fill="#1d2824">唱後再吹</text><text x="126" y="714" font-family="Microsoft JhengHei, sans-serif" font-size="34" fill="#3c5147">把聲音與動作連起來</text></svg>