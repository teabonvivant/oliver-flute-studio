<svg xmlns="http://www.w3.org/2000/svg" width="800" height="920" viewBox="0 0 800 920" role="img" aria-labelledby="t d"><title id="t">舞台收音的三個觀察</title><desc id="d">釐清：麥克風若直接接到吹口氣流，可能收進較多風聲。；嘗試：試音先吹包含低音、高音及較強力度的短段，請收音人員聽觀眾席的效果；回看：正式上台前記住可用的站位與樂器方向，演奏時便不必一直追着麥克風</desc><rect width="800" height="920" fill="#eff2ed"/><text x="42" y="70" font-family="Microsoft JhengHei, sans-serif" font-size="34" fill="#1d2824" font-weight="600">舞台收音的三個觀察</text><path d="M72 188V774" stroke="#9aaea0" stroke-width="2"/><circle cx="72" cy="200" r="23" fill="#254f45"/><text x="72" y="210" text-anchor="middle" font-size="27" font-family="sans-serif" fill="#fff">1</text><text x="126" y="210" font-family="Microsoft JhengHei, sans-serif" font-size="32" font-weight="600" fill="#1d2824">釐清</text><text x="126" y="262" font-family="Microsoft JhengHei, sans-serif" font-size="34" fill="#3c5147">麥克風若直接接到吹口氣流，可能收進較</text><text x="126" y="304" font-family="Microsoft JhengHei, sans-serif" font-size="34" fill="#3c5147">多風聲。</text><circle cx="72" cy="426" r="23" fill="#254f45"/><text x="72" y="436" text-anchor="middle" font-size="27" font-family="sans-serif" fill="#fff">2</text><text x="126" y="436" font-family="Microsoft JhengHei, sans-serif" font-size="32" font-weight="600" fill="#1d2824">嘗試</text><text x="126" y="488" font-family="Microsoft JhengHei, sans-serif" font-size="34" fill="#3c5147">試音先吹包含低音、高音及較強力度的短</text><text x="126" y="530" font-family="Microsoft JhengHei, sans-serif" font-size="34" fill="#3c5147">段，請收音人員聽觀眾席的效果</text><circle cx="72" cy="652" r="23" fill="#254f45"/><text x="72" y="662" text-anchor="middle" font-size="27" font-family="sans-serif" fill="#fff">3</text><text x="126" y="662" font-family="Microsoft JhengHei, sans-serif" font-size="32" font-weight="600" fill="#1d2824">回看</text><text x="126" y="714" font-family="Microsoft JhengHei, sans-serif" font-size="34" fill="#3c5147">正式上台前記住可用的站位與樂器方向，</text><text x="126" y="756" font-family="Microsoft JhengHei, sans-serif" font-size="34" fill="#3c5147">演奏時便不必一直追着麥克風</text></svg>