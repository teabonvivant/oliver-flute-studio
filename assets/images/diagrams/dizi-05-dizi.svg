<svg xmlns="http://www.w3.org/2000/svg" width="800" height="920" viewBox="0 0 800 920" role="img" aria-labelledby="t d"><title id="t">裝飾技巧的三個觀察</title><desc id="d">釐清：裝飾音先放回骨幹旋律理解：它帶向哪個主要音，落在哪個時間位置？；嘗試：先把樂句中的裝飾暫時拿走，唱清楚主要音及其落點，再選一處加入打音或滑音；回看：錄下前後兩個版本，問自己：旋律的重點更清楚了嗎？若只聽到手指很忙，主要音反而模糊，減少一點往往更能讓句子說話</desc><rect width="800" height="920" fill="#eff2ed"/><text x="42" y="70" font-family="Microsoft JhengHei, sans-serif" font-size="34" fill="#1d2824" font-weight="600">裝飾技巧的三個觀察</text><path d="M72 188V774" stroke="#9aaea0" stroke-width="2"/><circle cx="72" cy="200" r="23" fill="#254f45"/><text x="72" y="210" text-anchor="middle" font-size="27" font-family="sans-serif" fill="#fff">1</text><text x="126" y="210" font-family="Microsoft JhengHei, sans-serif" font-size="32" font-weight="600" fill="#1d2824">釐清</text><text x="126" y="262" font-family="Microsoft JhengHei, sans-serif" font-size="34" fill="#3c5147">裝飾音先放回骨幹旋律理解：它帶向哪個</text><text x="126" y="304" font-family="Microsoft JhengHei, sans-serif" font-size="34" fill="#3c5147">主要音，落在哪個時間位置？</text><circle cx="72" cy="426" r="23" fill="#254f45"/><text x="72" y="436" text-anchor="middle" font-size="27" font-family="sans-serif" fill="#fff">2</text><text x="126" y="436" font-family="Microsoft JhengHei, sans-serif" font-size="32" font-weight="600" fill="#1d2824">嘗試</text><text x="126" y="488" font-family="Microsoft JhengHei, sans-serif" font-size="34" fill="#3c5147">先把樂句中的裝飾暫時拿走，唱清楚主要</text><text x="126" y="530" font-family="Microsoft JhengHei, sans-serif" font-size="34" fill="#3c5147">音及其落點，再選一處加入打音或滑音</text><circle cx="72" cy="652" r="23" fill="#254f45"/><text x="72" y="662" text-anchor="middle" font-size="27" font-family="sans-serif" fill="#fff">3</text><text x="126" y="662" font-family="Microsoft JhengHei, sans-serif" font-size="32" font-weight="600" fill="#1d2824">回看</text><text x="126" y="714" font-family="Microsoft JhengHei, sans-serif" font-size="34" fill="#3c5147">錄下前後兩個版本，問自己：旋律的重點</text><text x="126" y="756" font-family="Microsoft JhengHei, sans-serif" font-size="34" fill="#3c5147">更清楚了嗎？若只聽到手指很忙，主要音</text><text x="126" y="798" font-family="Microsoft JhengHei, sans-serif" font-size="34" fill="#3c5147">反而模糊，減少一點往往更能讓句子說話</text></svg>