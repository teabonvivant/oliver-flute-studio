<svg xmlns="http://www.w3.org/2000/svg" width="800" height="920" viewBox="0 0 800 920" role="img" aria-labelledby="t d"><title id="t">演出佈置的三個觀察</title><desc id="d">釐清：演出前先把鼓放在穩定且手部容易到達的位置，確認座位高度與揮槌空間。；嘗試：彩排時按正式演奏的順序坐下、放好樂譜並拿起鼓槌，檢查伸手最遠的音是否仍自然；回看：演奏結束後也留時間讓餘音散去，再移開雙手或起身</desc><rect width="800" height="920" fill="#eff2ed"/><text x="42" y="70" font-family="Microsoft JhengHei, sans-serif" font-size="34" fill="#1d2824" font-weight="600">演出佈置的三個觀察</text><path d="M72 188V774" stroke="#9aaea0" stroke-width="2"/><circle cx="72" cy="200" r="23" fill="#254f45"/><text x="72" y="210" text-anchor="middle" font-size="27" font-family="sans-serif" fill="#fff">1</text><text x="126" y="210" font-family="Microsoft JhengHei, sans-serif" font-size="32" font-weight="600" fill="#1d2824">釐清</text><text x="126" y="262" font-family="Microsoft JhengHei, sans-serif" font-size="34" fill="#3c5147">演出前先把鼓放在穩定且手部容易到達的</text><text x="126" y="304" font-family="Microsoft JhengHei, sans-serif" font-size="34" fill="#3c5147">位置，確認座位高度與揮槌空間。</text><circle cx="72" cy="426" r="23" fill="#254f45"/><text x="72" y="436" text-anchor="middle" font-size="27" font-family="sans-serif" fill="#fff">2</text><text x="126" y="436" font-family="Microsoft JhengHei, sans-serif" font-size="32" font-weight="600" fill="#1d2824">嘗試</text><text x="126" y="488" font-family="Microsoft JhengHei, sans-serif" font-size="34" fill="#3c5147">彩排時按正式演奏的順序坐下、放好樂譜</text><text x="126" y="530" font-family="Microsoft JhengHei, sans-serif" font-size="34" fill="#3c5147">並拿起鼓槌，檢查伸手最遠的音是否仍自</text><text x="126" y="572" font-family="Microsoft JhengHei, sans-serif" font-size="34" fill="#3c5147">然</text><circle cx="72" cy="652" r="23" fill="#254f45"/><text x="72" y="662" text-anchor="middle" font-size="27" font-family="sans-serif" fill="#fff">3</text><text x="126" y="662" font-family="Microsoft JhengHei, sans-serif" font-size="32" font-weight="600" fill="#1d2824">回看</text><text x="126" y="714" font-family="Microsoft JhengHei, sans-serif" font-size="34" fill="#3c5147">演奏結束後也留時間讓餘音散去，再移開</text><text x="126" y="756" font-family="Microsoft JhengHei, sans-serif" font-size="34" fill="#3c5147">雙手或起身</text></svg>