<svg xmlns="http://www.w3.org/2000/svg" width="800" height="920" viewBox="0 0 800 920" role="img" aria-labelledby="t d"><title id="t">錄音技巧的三個觀察</title><desc id="d">釐清：手機錄音先避開直接接觸鼓身或容易傳震的桌面，用固定短句比較位置。；嘗試：正式錄製前先試最響的四拍，再聽是否有破裂或壓縮失真的聲音；回看：比較不同位置時使用同一段音型，記住哪個距離較清楚</desc><rect width="800" height="920" fill="#eff2ed"/><text x="42" y="70" font-family="Microsoft JhengHei, sans-serif" font-size="34" fill="#1d2824" font-weight="600">錄音技巧的三個觀察</text><path d="M72 188V774" stroke="#9aaea0" stroke-width="2"/><circle cx="72" cy="200" r="23" fill="#254f45"/><text x="72" y="210" text-anchor="middle" font-size="27" font-family="sans-serif" fill="#fff">1</text><text x="126" y="210" font-family="Microsoft JhengHei, sans-serif" font-size="32" font-weight="600" fill="#1d2824">釐清</text><text x="126" y="262" font-family="Microsoft JhengHei, sans-serif" font-size="34" fill="#3c5147">手機錄音先避開直接接觸鼓身或容易傳震</text><text x="126" y="304" font-family="Microsoft JhengHei, sans-serif" font-size="34" fill="#3c5147">的桌面，用固定短句比較位置。</text><circle cx="72" cy="426" r="23" fill="#254f45"/><text x="72" y="436" text-anchor="middle" font-size="27" font-family="sans-serif" fill="#fff">2</text><text x="126" y="436" font-family="Microsoft JhengHei, sans-serif" font-size="32" font-weight="600" fill="#1d2824">嘗試</text><text x="126" y="488" font-family="Microsoft JhengHei, sans-serif" font-size="34" fill="#3c5147">正式錄製前先試最響的四拍，再聽是否有</text><text x="126" y="530" font-family="Microsoft JhengHei, sans-serif" font-size="34" fill="#3c5147">破裂或壓縮失真的聲音</text><circle cx="72" cy="652" r="23" fill="#254f45"/><text x="72" y="662" text-anchor="middle" font-size="27" font-family="sans-serif" fill="#fff">3</text><text x="126" y="662" font-family="Microsoft JhengHei, sans-serif" font-size="32" font-weight="600" fill="#1d2824">回看</text><text x="126" y="714" font-family="Microsoft JhengHei, sans-serif" font-size="34" fill="#3c5147">比較不同位置時使用同一段音型，記住哪</text><text x="126" y="756" font-family="Microsoft JhengHei, sans-serif" font-size="34" fill="#3c5147">個距離較清楚</text></svg>