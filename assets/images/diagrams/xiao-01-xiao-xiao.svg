<svg xmlns="http://www.w3.org/2000/svg" width="800" height="920" viewBox="0 0 800 920" role="img" aria-labelledby="t d"><title id="t">簫入門的三個觀察</title><desc id="d">釐清：洞簫從管端吹口送氣，初學先找自然短音，再追求長度。；嘗試：先不急着改指法，在舒服持握下試短音，吹響後停一停，再重複相同動作；回看：找到短音後，再把它延長一點，保留相近音色</desc><rect width="800" height="920" fill="#eff2ed"/><text x="42" y="70" font-family="Microsoft JhengHei, sans-serif" font-size="34" fill="#1d2824" font-weight="600">簫入門的三個觀察</text><path d="M72 188V774" stroke="#9aaea0" stroke-width="2"/><circle cx="72" cy="200" r="23" fill="#254f45"/><text x="72" y="210" text-anchor="middle" font-size="27" font-family="sans-serif" fill="#fff">1</text><text x="126" y="210" font-family="Microsoft JhengHei, sans-serif" font-size="32" font-weight="600" fill="#1d2824">釐清</text><text x="126" y="262" font-family="Microsoft JhengHei, sans-serif" font-size="34" fill="#3c5147">洞簫從管端吹口送氣，初學先找自然短音</text><text x="126" y="304" font-family="Microsoft JhengHei, sans-serif" font-size="34" fill="#3c5147">，再追求長度。</text><circle cx="72" cy="426" r="23" fill="#254f45"/><text x="72" y="436" text-anchor="middle" font-size="27" font-family="sans-serif" fill="#fff">2</text><text x="126" y="436" font-family="Microsoft JhengHei, sans-serif" font-size="32" font-weight="600" fill="#1d2824">嘗試</text><text x="126" y="488" font-family="Microsoft JhengHei, sans-serif" font-size="34" fill="#3c5147">先不急着改指法，在舒服持握下試短音，</text><text x="126" y="530" font-family="Microsoft JhengHei, sans-serif" font-size="34" fill="#3c5147">吹響後停一停，再重複相同動作</text><circle cx="72" cy="652" r="23" fill="#254f45"/><text x="72" y="662" text-anchor="middle" font-size="27" font-family="sans-serif" fill="#fff">3</text><text x="126" y="662" font-family="Microsoft JhengHei, sans-serif" font-size="32" font-weight="600" fill="#1d2824">回看</text><text x="126" y="714" font-family="Microsoft JhengHei, sans-serif" font-size="34" fill="#3c5147">找到短音後，再把它延長一點，保留相近</text><text x="126" y="756" font-family="Microsoft JhengHei, sans-serif" font-size="34" fill="#3c5147">音色</text></svg>